[package]
name = "lets-rag-docs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local, private retrieval over scanned documents: OCR, bge-m3 hybrid search in Qdrant, MCP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lets-code-apps/lets-rag-docs"
readme = "README.md"
keywords = ["rag", "ocr", "qdrant", "mcp", "search"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
qdrant-client = { version = "1.20.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rmcp = { version = "3.8.0", features = ["transport-io"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
