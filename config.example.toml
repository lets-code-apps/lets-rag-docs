# Let's RAG Docs configuration.
#
# Copy this file to ~/.config/lets-rag-docs/config.toml and adjust it. Without that file the
# defaults below are used. Every section and key is optional; the values shown are the
# defaults. Unknown keys are an error, so typos are caught early.

[qdrant]
# Qdrant's gRPC port (6334, not the 6333 REST port). `docker compose up -d` starts it on 127.0.0.1.
url = "http://127.0.0.1:6334"
collection = "documents"

[embed]
# The bge-m3 embedding sidecar (embed_server.py).
url = "http://127.0.0.1:8100"

[paths]
# Relative paths are resolved against the current directory. A leading ~ is expanded.
# OCR output: one .txt file per document, as written by ocr.py.
ocr_dir = "data/ocr"
# Retrieval evals, one JSON object per line: {"id", "lang", "question", "expect", "source"}.
evals = "evals/rag.jsonl"
# The original documents (the folder you ran ocr.py on). `classify` hashes each one, so a
# document keeps its row in the database even if it is renamed or moved.
docs_dir = "docs"
# SQLite database with what `classify` found out about each document.
db = "data/lets-rag-docs.sqlite"
# Where `organize --apply` copies originals into, under <folder>/<date> <title>. Keep it separate from
# docs_dir and ocr_dir: `organize` refuses to run if the library is inside (or contains) either,
# so a filed copy can never be OCR'd or classified as a new original.
library_dir = "library"

[llm]
# Used by `ask` and `classify`. Any OpenAI-compatible endpoint; Ollama by default.
base_url = "http://127.0.0.1:11434/v1"
model = "qwen3:30b-a3b"
# The most tokens the model may write. Qwen3 thinks before it answers, so leave room.
max_tokens = 4096
timeout_seconds = 300
# PRIVACY: your documents' text is sent to this server. It must be on this machine or your own
# network; any other address is refused. true switches that check off. Leave it false.
allow_remote = false

[classify]
# The document types `classify` lets the model choose from. An answer outside this list is
# stored as `unsorted` (always the fallback, not listed here).
types = [
  "identity", "medical", "invoice", "receipt", "contract", "loan", "insurance", "tax", "bank",
  "warranty", "certificate", "letter", "other",
]
# The library folders `organize` files copies under (`library/<folder>/<date> <title>`). A fixed list, so
# one family's documents in four languages don't end up in "Home", "Dom" and "Дом" side by side.
# An answer outside this list files the copy under `unsorted/`. After changing it, run
# `classify --force` so stored documents pick from the new list.
folders = [
  "Identity", "Health", "Finance", "Taxes", "Insurance", "Home", "Car", "Work", "Education",
  "Purchases", "Letters", "Other",
]

[ocr]
# How `add <file>` runs OCR: it shells out to this Python script (OCR stays Python for now).
# Relative paths resolve against the current directory; a leading ~ is expanded. If an MCP client
# starts the server from a different folder, use absolute paths for both.
python = ".venv/bin/python"
script = "ocr.py"
