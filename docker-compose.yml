# Qdrant vector DB. Dashboard: http://localhost:6333/dashboard
# Python (OCR, embeddings) stays native: Apple Vision and the Mac GPU aren't available inside Docker.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"  # HTTP + dashboard, this Mac only
      - "127.0.0.1:6334:6334"  # gRPC, for the Rust client later
    volumes:
      - qdrant:/qdrant/storage

volumes:
  qdrant:
